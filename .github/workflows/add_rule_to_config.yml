name: add_line_to_config

# JavaScript Actions 使用 Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  repository_dispatch:
    types: [add_line_to_config]

  workflow_dispatch:
    inputs:
      method:
        description: '选择规则类型'
        required: true
        type: choice
        options:
          - DOMAIN-SUFFIX
          - DOMAIN-KEYWORD
          - DOMAIN
          - IP-CIDR
        default: 'DOMAIN-SUFFIX'

      text:
        description: '填写域名/IP（例如 ddys.tv）'
        required: true
        type: string

      path:
        description: '选择文件路径'
        required: true
        type: choice
        options:
          - clash_rule/video_china.list
          - clash_rule/proxy.list
        default: 'clash_rule/video_china.list'

jobs:
  add-line:
    # 固定 Ubuntu 版本，避免 ubuntu-latest 自动迁移
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: 获取参数并检查文件
        id: params
        env:
          INPUT_METHOD: ${{ github.event.client_payload.method || github.event.inputs.method }}
          INPUT_TEXT: ${{ github.event.client_payload.text || github.event.inputs.text }}
          INPUT_PATH: ${{ github.event.client_payload.path || github.event.inputs.path }}
        run: |
          set -e

          METHOD="$INPUT_METHOD"
          TEXT="$INPUT_TEXT"
          RULE_FILE="$INPUT_PATH"

          # 检查规则类型
          case "$METHOD" in
            DOMAIN-SUFFIX|DOMAIN-KEYWORD|DOMAIN|IP-CIDR)
              ;;
            *)
              echo "❌ 错误：不支持的规则类型"
              exit 1
              ;;
          esac

          # 检查文件路径，防止写入其他文件
          case "$RULE_FILE" in
            clash_rule/video_china.list|clash_rule/proxy.list)
              ;;
            *)
              echo "❌ 错误：不允许的文件路径"
              exit 1
              ;;
          esac

          # 检查内容
          if [ -z "$TEXT" ]; then
            echo "❌ 错误：内容不能为空"
            exit 1
          fi

          if [[ "$TEXT" == *$'\n'* || "$TEXT" == *$'\r'* || "$TEXT" == *','* ]]; then
            echo "❌ 错误：内容不能包含换行符或逗号"
            exit 1
          fi

          # 检查文件是否存在
          if [ ! -f "$RULE_FILE" ]; then
            echo "❌ 错误：文件不存在：$RULE_FILE"
            exit 1
          fi

          echo "method=$METHOD" >> "$GITHUB_OUTPUT"
          echo "text=$TEXT" >> "$GITHUB_OUTPUT"
          echo "path=$RULE_FILE" >> "$GITHUB_OUTPUT"

          echo "✅ 参数与文件校验通过"

      - name: 组合内容并写入文件
        id: add_rule
        env:
          METHOD: ${{ steps.params.outputs.method }}
          TEXT: ${{ steps.params.outputs.text }}
          RULE_FILE: ${{ steps.params.outputs.path }}
        run: |
          set -e

          LINE="${METHOD},${TEXT}"

          # 将规则输出给后续步骤
          {
            echo "line<<EOF"
            echo "$LINE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # 已存在则跳过，不让工作流失败
          if grep -qxF -- "$LINE" "$RULE_FILE"; then
            echo "ℹ️ 内容已存在，跳过添加：$LINE"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$LINE" >> "$RULE_FILE"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "✅ 已添加新规则：$LINE"

      - name: 提交并推送
        if: steps.add_rule.outputs.changed == 'true'
        env:
          RULE_FILE: ${{ steps.params.outputs.path }}
          LINE: ${{ steps.add_rule.outputs.line }}
        run: |
          set -e

          git config user.name "pscchiang"
          git config user.email "brandon1587@gmail.com"

          git add -- "$RULE_FILE"

          if git diff --cached --quiet; then
            echo "ℹ️ 无修改"
            exit 0
          fi

          git commit -m "feat: 添加规则 - $LINE"
          git push

          echo "✅ 推送成功"
